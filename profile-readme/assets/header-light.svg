<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="gi-os. Giovanni Lupo. Small software, mostly for small screens.">
  <defs>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.6" fill="#0E0E0E" opacity="0.22"/>
      <circle cx="3" cy="3" r="0.6" fill="#0E0E0E" opacity="0.22"/>
    </pattern>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#F4F3EF"/>
  <rect x="0" y="0" width="1000" height="300" fill="url(#dither)"/>

  <!-- device -->
  <rect x="64" y="26" width="168" height="248" rx="20" fill="#E7E5DF" stroke="#D6D3CB" stroke-width="2"/>
  <rect x="80" y="42" width="136" height="196" rx="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1"/>
  <circle cx="148" cy="256" r="7" fill="none" stroke="#D6D3CB" stroke-width="2"/>

  <!-- status bar -->
  <text class="m" x="92" y="61" font-size="10" fill="#6E6C66">9:41</text>
  <rect x="182" y="53" width="20" height="9" rx="2" fill="none" stroke="#6E6C66" stroke-width="1"/>
  <rect x="184" y="55" width="11" height="5" fill="#6E6C66"/>
  <rect x="203" y="55.5" width="2" height="4" rx="1" fill="#6E6C66"/>
  <line x1="88" y1="70" x2="208" y2="70" stroke="#D6D3CB" stroke-width="1"/>
  <text class="m" x="92" y="92" font-size="11" fill="#0E0E0E">› about</text>
  <text class="m" x="92" y="114" font-size="11" fill="#6E6C66">  shops</text>
  <text class="m" x="92" y="136" font-size="11" fill="#6E6C66">  phones</text>
  <text class="m" x="92" y="158" font-size="11" fill="#6E6C66">  systems</text>
  <text class="m" x="92" y="180" font-size="11" fill="#6E6C66">  stack</text>
  <text class="m" x="92" y="202" font-size="11" fill="#6E6C66">  elsewhere</text>
  <rect x="88" y="212" width="120" height="18" fill="none" stroke="#D6D3CB" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="m" x="98" y="224" font-size="9" fill="#6E6C66">more ›</text>

  <!-- wordmark -->
  <text class="m" x="286" y="130" font-size="86" font-weight="700" letter-spacing="-3" fill="#0E0E0E">gi-os</text>
  <text class="m" x="290" y="164" font-size="17" letter-spacing="4" fill="#6E6C66">GIOVANNI LUPO</text>
  <line x1="290" y1="188" x2="936" y2="188" stroke="#D6D3CB" stroke-width="2"/>
  <text class="m" x="290" y="218" font-size="20" fill="#0E0E0E">small software, mostly for small screens</text>
  <text class="m" x="290" y="248" font-size="13" fill="#6E6C66">kotlin  ·  javascript  ·  docker  ·  new york  ·  gzl.dev</text>
</svg>
