version: "3"
services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - {SHOP_DIR}:/app
    ports:
      - "127.0.0.1:{PORT}:3000"
    environment:
      - NEXT_PUBLIC_BASE_PATH=/{SLUG}
      - BASE_PATH=/{SLUG}
      # Drives the internal banner and the noindex header. Anything other than
      # in_production marks the site as not approved. Launchpad rewrites this
      # line and rebuilds the shop when the stage changes.
      - SHOP_STAGE={STAGE}
    command: sh -c "([ -d node_modules ] || npm install) && ([ -f .next/BUILD_ID ] || npm run build) && npm start"
    restart: unless-stopped
